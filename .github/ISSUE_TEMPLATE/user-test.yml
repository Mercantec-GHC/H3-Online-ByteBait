name: 🧪 Brugertest
description: Feedback fra en testperson uden for gruppen
title: "Brugertest: "
labels: [user-test, test]
body:
  - type: input
    id: who
    attributes:
      label: Testperson (fornavn/rolle) og dato
      placeholder: Fx "Mikkel, klassekammerat, 3/12"
    validations:
      required: true
  - type: checkboxes
    id: understood
    attributes:
      label: Forstod testpersonen spillet uden forklaring?
      options:
        - label: Kast med timingmåleren
        - label: Krogning (ryk ved bid)
        - label: Fight (træk modsat, giv line, yank ved blå LED'er)
        - label: Hub (sælg fisk, køb udstyr)
        - label: Akvarium
  - type: textarea
    id: observations
    attributes:
      label: Observationer
    validations:
      required: true
  - type: textarea
    id: quotes
    attributes:
      label: Citater / feedback
  - type: textarea
    id: improvement
    attributes:
      label: Forbedring vi gennemfører
      description: Link til PR/issue, når forbedringen er lavet.
