name: 🚀 Release
description: Fredags-release med fælles release-DoD
title: "[Release] vX.Y.0"
labels: [release]
body:
  - type: textarea
    id: goal
    attributes:
      label: Releasemål
      description: Hvad skal virke i denne release?
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Release-DoD
      value: |
        - [ ] Alle sprint-opgaver i milestonen er lukket eller flyttet med begrundelse
        - [ ] CI er grøn på `dev`, og alle tests består
        - [ ] Releasemålet er demonstreret i Test-ByteBait med den rigtige Oplà (smoke-test)
        - [ ] `dev` er merget til `main` via en godkendt release-PR
        - [ ] Main-ByteBait er deployet, og smoke-testen er gentaget der
        - [ ] Ingen hemmeligheder i repoet
        - [ ] README og docs er opdateret
        - [ ] Tag og GitHub Release er oprettet
        - [ ] Kendte fejl er oprettet som issues med label `bug`
        - [ ] Sprint-review og retro er skrevet nedenfor
  - type: textarea
    id: retro
    attributes:
      label: Retro
      value: |
        **Gik godt:**
        **Ændrer vi:**
